# MusBread public static contour — pre-award template.
# Loopback binding is intentional: use only behind an approved HTTPS frontend.
# Replace listener/domain/paths after formal infrastructure acceptance.
server {
    listen 127.0.0.1:18080;
    server_name localhost;

    root /srv/musbread/public/current;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # No backend proxy; no PHP execution; no access to internal CMS.
    location ~* ^/(admin|api|vendor|storage)(/|$) {
        return 404;
    }
    location ~* \.(php|phtml|phar|cgi|env|sql|sqlite|bak|log)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 365d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /media/ {
        try_files $uri =404;
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

# MusBread public static contour — pre-award template.
# Loopback binding is intentional: use only behind an approved HTTPS frontend.
# Replace listener/domain/paths after formal infrastructure acceptance.
server {
    listen 127.0.0.1:18080;
    server_name localhost;

    root /srv/musbread/public/current;
    index index.html;
    autoindex off;
    server_tokens off;
    charset utf-8;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Generate from the EXACT Next.js release using scripts/build_csp.py,
    # install atomically with that release and reload Nginx (also after rollback).
    include /etc/nginx/musbread-csp.conf;

    # No backend proxy; no PHP execution; no access to internal CMS.
    location ~* ^/(admin|api|vendor|storage)(/|$) {
        return 404;
    }
    location ~* \.(php|phtml|phar|cgi|env|sql|sqlite|bak|log)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }

    # Next.js static export requires one reserved fallback for empty EN data.
    # The static test server serves the HTML with 200; production must reject it.
    location = /en/museum/not-translated/ { return 404; }
    location = /en/museum/not-translated { return 404; }

    location /_next/static/ {
        try_files $uri =404;
        expires 365d;
        # Do not add location-specific add_header directives here:
        # that would remove inherited CSP and security headers on assets.
    }
    location /media/ {
        try_files $uri =404;
        expires 1d;
    }
    # Approved Office/PDF assets are DOWNLOAD-ONLY, never inline-executed.
    # Explicitly repeat headers because add_header in a location overrides
    # inherited security headers.
    location /documents/ {
        try_files $uri =404;
        types {}
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        include /etc/nginx/musbread-csp.conf;
        expires 1d;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}

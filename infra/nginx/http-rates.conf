# Install under nginx http{} context, e.g. /etc/nginx/conf.d/musbread-rates.conf.
# Only mutating POST requests consume the budgets; viewing the media library
# does not get throttled. Museum NAT / trusted proxy IPs must be assessed.
map $request_method $musbread_write_ip {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $musbread_write_ip zone=musbread_auth:10m rate=8r/m;
limit_req_zone $musbread_write_ip zone=musbread_upload:10m rate=30r/m;

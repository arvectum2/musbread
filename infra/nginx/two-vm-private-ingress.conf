
# VM1 ONLY. Private interface 10.20.30.10 and public VM2 10.20.30.20
# are ILLUSTRATIVE. Replace and verify firewall denies all other sources.
# A SEPARATE PHP-FPM instance/pool/user with no CMS files, DB keys or network
# access MUST serve only /srv/musbread/request-ingress/public/index.php.
server {
    listen 10.20.30.10:9443 ssl;
    server_name ingress-private.example.invalid;
    ssl_certificate /etc/musbread/tls/ingress-private.crt;
    ssl_certificate_key /etc/musbread/tls/ingress-private.key;
    ssl_client_certificate /etc/musbread/tls/internal-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    allow 10.20.30.20;
    deny all;
    client_max_body_size 8k;
    access_log off;
    add_header Cache-Control no-store always;
    location = /v1/requests {
        limit_except POST { deny all; }
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        # Only nginx can set this FastCGI variable; the browser cannot
        # inject it via an HTTP header. Keep MUSEUM_TRUSTED_PROXY=1 enabled.
        fastcgi_param MUSEUM_CLIENT_IP $http_x_museum_client_ip;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/musbread-ingress/ingress.sock;
    }
    location / { return 404; }
}
server {
    # CMS imports by mTLS over LOOPBACK on the same private VM.
    # The internal pull endpoint is NEVER reachable from VM2.
    listen 127.0.0.1:8443 ssl;
    server_name ingress-internal.example.invalid;
    ssl_certificate /etc/musbread/tls/ingress-internal.crt;
    ssl_certificate_key /etc/musbread/tls/ingress-internal.key;
    ssl_client_certificate /etc/musbread/tls/internal-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 8k;
    access_log off;
    add_header Cache-Control no-store always;
    location = /health {
        limit_except GET { deny all; }
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/musbread-ingress/ingress.sock;
    }
    location = /internal/pull {
        limit_except GET { deny all; }
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/musbread-ingress/ingress.sock;
    }
    location = /internal/ack {
        limit_except POST { deny all; }
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/musbread-ingress/ingress.sock;
    }
    location / { return 404; }
}

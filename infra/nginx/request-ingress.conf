# Dedicated DMZ host for visitor requests, NOT the public static-site host.
# Example only. Substitute hostnames, private IP, certificates, FPM socket.
# Private listener MUST be unreachable from the Internet (firewall + routing).
server {
    listen 443 ssl;
    server_name requests.example.invalid;
    ssl_certificate /etc/musbread/tls/ingress.crt;
    ssl_certificate_key /etc/musbread/tls/ingress.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /srv/musbread/request-ingress/public;
    client_max_body_size 8k;
    access_log off; # never log request identifiers or sensitive URLs
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;

    # PHP source and queue files never served. Only two public endpoints.
    location = /v1/requests {
        limit_except POST OPTIONS { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location = /health {
        limit_except GET { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location / { return 404; }
}
server {
    # Bind only to the museum's private interface AND firewall-allowlist CMS host.
    listen 10.20.30.10:8443 ssl;
    server_name requests-internal.example.invalid;
    ssl_certificate /etc/musbread/tls/ingress.crt;
    ssl_certificate_key /etc/musbread/tls/ingress.key;
    ssl_client_certificate /etc/musbread/tls/private-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 8k;
    add_header Cache-Control no-store always;

    location = /internal/pull {
        limit_except GET { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location = /internal/ack {
        limit_except POST { deny all; }
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /srv/musbread/request-ingress/public/index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location / { return 404; }
}

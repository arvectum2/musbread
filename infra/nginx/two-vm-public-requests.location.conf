
# Include inside the TLS server {} serving musbread.ru on VM2 ONLY AFTER
# museum approval of the single POST proxy exception to static-only hosting.
# No PHP, Node, database, CMS, or generic proxy on the public VM.
location = /v1/requests {
    limit_except POST { deny all; }
    limit_req zone=musbread_requests_by_ip burst=4 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    # Do not spill PII to client_body_temp_path on the public static VM.
    # Forward the request body directly to the dedicated isolated receiver.
    client_body_buffer_size 16k;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 10s;
    proxy_read_timeout 10s;
    proxy_next_upstream off;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name ingress-private.example.invalid;
    proxy_ssl_trusted_certificate /etc/musbread/tls/internal-ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_certificate /etc/musbread/tls/public-proxy-client.crt;
    proxy_ssl_certificate_key /etc/musbread/tls/public-proxy-client.key;
    proxy_set_header Host ingress-private.example.invalid;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Museum-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header Connection "";
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_pass https://10.20.30.10:9443;
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
}
# All other static locations remain under infra/nginx/public-static.conf.
# Never add a generic location / proxy_pass to the CMS or to this receiver.

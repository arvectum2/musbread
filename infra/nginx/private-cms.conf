# MusBread private CMS — example only. Never expose this listener publicly.
# Production requires Museum-controlled trusted IPs/TLS/network segregation.
server {
    listen 127.0.0.1:18082;
    server_name localhost;

    root /srv/musbread/cms/public;
    index index.php;
    autoindex off;
    server_tokens off;
    charset utf-8;

    client_max_body_size 6m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "private, no-store" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 30s;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }
    location ~ ^/(storage|database|bootstrap|vendor)/ { return 404; }
}

# MusBread private CMS — example only. Never expose this listener publicly.
# Production requires Museum-controlled trusted IPs/TLS/network segregation.
server {
    listen 127.0.0.1:18082;
    server_name localhost;

    root /srv/musbread/cms/public;
    index index.php;
    autoindex off;
    server_tokens off;
    charset utf-8;

    client_max_body_size 6m;
    limit_req_status 429;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "private, no-store" always;
    # Restrict embedding without interfering with MoonShine's inline editor JS.
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    # Defense in depth: Laravel imposes an additional per-IP request budget.
    # Zones below are declared at HTTP scope, not inside this server.
    location = /admin/authenticate {
        limit_req zone=musbread_auth burst=5 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location = /admin/museum-media {
        limit_req zone=musbread_upload burst=15 nodelay;
        try_files $uri /index.php?$query_string;
    }
    location ~ ^/index\.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 30s;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { return 404; }
    # Only the explicitly allowlisted MoonShine frontend asset families may
    # be served from public/vendor. The Composer PHP vendor tree must NEVER
    # be reachable. Earlier deny /. and *.php match before this rule.
    location ~ ^/vendor/(moonshine|museum-jodit)/.+\.(?:js|css|woff2?|png|jpe?g|svg|ico|json|gif)$ {
        try_files $uri =404;
    }
    # Every OTHER /vendor path (source code, sourcemaps, .d.ts, markdown,
    # unapproved modules) remains denied.
    location ~ ^/(storage|database|bootstrap|vendor)/ { return 404; }
}

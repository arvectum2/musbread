; Dedicated php-fpm INSTANCE (never load into CMS shared master).
[requests]
user = musbread-ingress
group = musbread-ingress
listen = /run/musbread-ingress/ingress.sock
listen.owner = musbread-ingress
listen.group = musbread-ingress-socket
listen.mode = 0660
pm = ondemand
pm.max_children = 4
pm.process_idle_timeout = 10s
pm.max_requests = 500
security.limit_extensions = .php
catch_workers_output = no
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[open_basedir] = /srv/musbread/request-ingress:/var/lib/musbread-requests
php_admin_value[session.save_path] = /var/lib/musbread-requests
; Inherited environment exists ONLY in this dedicated systemd instance.
clear_env = no

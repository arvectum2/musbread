name: MusBread quality gates
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  publisher:
    name: Static publication integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/publish_snapshot.py --check
  web:
    name: Next.js lint, types and static export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Check production Node.js dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - name: Offline integrations contract tests
        run: npm run test:integrations
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install headless Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Save demo screenshots / failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musbread-public-browser-evidence
          path: |
            apps/web/test-results/**/*.png
            apps/web/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 ../../scripts/release_site.py deploy && python3 ../../scripts/release_site.py verify
      - name: Reject private files and secrets in static export
        run: python3 ../../scripts/audit_public_artifacts.py out
      - name: Verify all internal routes and anchors
        run: python3 ../../scripts/audit_static_navigation.py out
      - name: Check public export
        run: |
          test -f out/index.html
          test -f out/events/index.html
          test -f out/events/bread-history/index.html
          test -f out/museum/museum-about/index.html
          test -f out/news/demo-news/index.html
          test -f out/excursions/demo-tour/index.html
          if grep -R -E '(DATABASE_URL|APP_KEY|MOONSHINE_SECRET)' out/; then
            echo "Potential secret in site export"
            exit 1
          fi
  cms:
    name: Laravel tests (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check PHP dependency advisories
        run: composer audit --locked --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: mkdir -p database && touch database/database.sqlite && php artisan migrate --force
      - run: php artisan test
      - name: Check Laravel to Next.js publication parity
        run: |
          php artisan db:seed --class=DemoMuseumContentSeeder --force
          php artisan museum:export
          python3 ../../scripts/publish_snapshot.py --check
  integration:
    name: CMS editor → build → verified public release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and frontend
        run: |
          cd apps/cms
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          # composer install does not run post-update-cmd: MoonShine/TinyMCE
          # assets otherwise return 404 and Alpine x-cloak hides the login.
          php artisan vendor:publish --tag=laravel-assets --force
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=DemoMuseumContentSeeder --force
          cd ../web
          npm ci
      - name: Execute native cross-stack publication
        run: sh scripts/demo_publish.sh
      - name: Verify static site and release
        run: |
          python3 scripts/release_site.py verify
          test -f deploy/local/current/index.html
          test -f deploy/local/current/museum/museum-about/index.html
          test -f deploy/local/current/news/demo-news/index.html
          test -f deploy/local/current/excursions/demo-tour/index.html
          cd apps/cms
          php artisan schedule:list | grep 'museum:export'
      - name: Install Chromium for isolated private CMS browser QA
        run: |
          cd apps/web
          npx playwright install --with-deps chromium
      - name: Browser E2E with temporary SQLite and ephemeral QA account
        run: python3 scripts/qa_cms_browser.py

  infra:
    name: Infrastructure templates and Nginx parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check templates do not expose private CMS
        run: python3 -m unittest tests/test_infra_templates.py -v
      - name: Parse both Linux Nginx examples
        run: |
          mkdir -p /tmp/musbread-csp-fixture
          printf '<html><script>window.__test = true;</script></html>' > /tmp/musbread-csp-fixture/index.html
          python3 scripts/build_csp.py /tmp/musbread-csp-fixture --output /tmp/musbread-csp.conf
          sudo cp /tmp/musbread-csp.conf /etc/nginx/musbread-csp.conf
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo cp infra/nginx/http-rates.conf /etc/nginx/conf.d/musbread-rates.conf
          sudo cp infra/nginx/public-static.conf /etc/nginx/sites-enabled/musbread-public.conf
          sudo cp infra/nginx/private-cms.conf /etc/nginx/sites-enabled/musbread-private.conf
          sudo nginx -t
          sudo mkdir -p /srv/musbread/public/current
          sudo cp /tmp/musbread-csp-fixture/index.html /srv/musbread/public/current/index.html
          sudo nginx
          curl -fsSI http://127.0.0.1:18080/ | grep -qi 'content-security-policy:'
          curl -fsSI http://127.0.0.1:18080/ | grep -qi 'x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/admin/login)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/test.php)" = 404

name: MusBread quality gates
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  publisher:
    name: Static publication integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native vector PDF rasterizer and design verification packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          python3 -m pip install "xlrd==2.0.2"
          python3 -m pip install -r scripts/requirements-design-tools.txt
      - run: python3 -m unittest discover -s tests -v
      - name: Verify actual physical print sizes and editable PPTX slide geometry
        run: python3 scripts/generate_technical_carriers.py --verify
      - name: Verify museum signage, labels and office carrier SVG/PDF geometry
        run: python3 scripts/generate_secondary_carriers.py --verify
      - name: Verify VK, website poster and merchandise editable SVG/PNG drafts
        run: python3 scripts/generate_digital_merch_carriers.py --verify
      - name: Audit required final formats vs technical pre-award geometry
        run: |
          python3 -m scripts.audit_final_formats --verify-generated             --json docs/handoff/FINAL_FORMAT_READINESS.json             --markdown docs/handoff/FINAL_FORMAT_READINESS.md
      - name: Audit lockfile declared licenses and TinyMCE GPL risk
        run: |
          python3 -m scripts.audit_dependency_rights --verify-generated             --json docs/handoff/DEPENDENCY_RIGHTS_REPORT.json             --markdown docs/handoff/DEPENDENCY_RIGHTS_REPORT.md
      - name: Verify complete CycloneDX SBOM for every locked dependency
        run: python3 scripts/build_dependency_sbom.py --verify-generated
      - name: Save all locked dependencies and license triage
        uses: actions/upload-artifact@v4
        with:
          name: musbread-preaward-full-locked-sbom
          path: |
            docs/handoff/SBOM_CYCLONEDX.json
            docs/handoff/SBOM_LICENSES.csv
            docs/handoff/SBOM_SUMMARY.json
            docs/handoff/SBOM_SUMMARY.md
          retention-days: 7
      - name: Verify required design carrier inventory and format evidence
        run: |
          python3 scripts/audit_design_delivery.py --check --verify-generated             --csv docs/handoff/DESIGN_DELIVERABLES.csv             --markdown docs/handoff/DESIGN_DELIVERABLES.md             --requests docs/handoff/CUSTOMER_INPUTS_AFTER_INTERVIEW.md             --json /tmp/musbread-design-handoff.json
      - name: Save source format and rights pre-award audits
        uses: actions/upload-artifact@v4
        with:
          name: musbread-format-and-rights-readiness
          path: |
            docs/handoff/FINAL_FORMAT_READINESS.json
            docs/handoff/FINAL_FORMAT_READINESS.md
            docs/handoff/DEPENDENCY_RIGHTS_REPORT.json
            docs/handoff/DEPENDENCY_RIGHTS_REPORT.md
          retention-days: 7
      - name: Save design inventory (targets, NOT approved results)
        uses: actions/upload-artifact@v4
        with:
          name: musbread-preaward-design-handoff-checklist
          path: /tmp/musbread-design-handoff.json
          retention-days: 7
      - name: Pre-award delivery template and blocker audit
        run: |
          python3 scripts/audit_delivery_readiness.py --require-complete-drafts             --json /tmp/musbread-delivery-readiness.json             --markdown /tmp/musbread-delivery-readiness.md
      - name: Preserve pre-award delivery audit
        uses: actions/upload-artifact@v4
        with:
          name: musbread-delivery-readiness-evidence
          path: |
            /tmp/musbread-delivery-readiness.json
            /tmp/musbread-delivery-readiness.md
          retention-days: 7
      - run: python3 scripts/publish_snapshot.py --check
      - name: Prepare deterministic pre-award handoff sample
        run: |
          python3 scripts/handoff_bundle.py build --output /tmp/musbread-preaward.zip
          python3 scripts/handoff_bundle.py verify /tmp/musbread-preaward.zip
          unzip -tq /tmp/musbread-preaward.zip
          mkdir -p /tmp/musbread-delivery-extract
          unzip -q /tmp/musbread-preaward.zip -d /tmp/musbread-delivery-extract
          python3 /tmp/musbread-delivery-extract/source/scripts/handoff_bundle.py verify /tmp/musbread-preaward.zip
      - name: Audit actual ZIP has no installed vendor or build payload
        run: python3 scripts/audit_built_artifacts.py --mode source-zip --zip /tmp/musbread-preaward.zip --out /tmp/musbread-source-zip-evidence.json
      - name: Preserve source-only ZIP content/license evidence
        uses: actions/upload-artifact@v4
        with:
          name: musbread-cp35-source-zip-inventory
          path: /tmp/musbread-source-zip-evidence.json
          retention-days: 7
      - name: Upload pre-award demo bundle (no credentials)
        uses: actions/upload-artifact@v4
        with:
          name: musbread-preaward-demo-handoff
          path: /tmp/musbread-preaward.zip
          retention-days: 7
  web:
    name: Next.js lint, types and static export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Check production Node.js dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Enforce rem/em typography from tender specification
        run: python3 ../../scripts/check_css_font_units.py src/app/globals.scss
      - run: npm run lint
      - name: Verify reference menu structure and factual contacts
        run: npm run test:reference
      - name: Offline integrations contract tests
        run: npm run test:integrations
      - name: Static global search index and multi-word relevance
        run: npm run test:search
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Check ALL static HTML landmarks, language, document hashes and alt attributes
        run: |
          python3 ../../scripts/audit_accessibility_content.py out             --snapshot src/data/published.json             --json /tmp/musbread-static-content-audit.json             --markdown /tmp/musbread-static-content-audit.md
      - name: Preserve accessibility audit (not ГОСТ/PDF-UA certification)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musbread-static-accessibility-audit
          path: |
            /tmp/musbread-static-content-audit.json
            /tmp/musbread-static-content-audit.md
          if-no-files-found: ignore
          retention-days: 7
      - name: Block premature search indexing
        run: python3 ../../scripts/check_preaward_seo.py out
      - name: Install headless Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - name: Save demo screenshots / failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musbread-public-browser-evidence
          path: |
            apps/web/test-results/**/*.png
            apps/web/test-results/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
      - run: python3 ../../scripts/release_site.py deploy && python3 ../../scripts/release_site.py verify
      - name: Actual static export SBOM evidence (compiled bundle provenance pending)
        run: python3 ../../scripts/audit_built_artifacts.py --mode web --web out --out /tmp/musbread-build-web-files.json
      - name: Preserve actual static export file hashes
        uses: actions/upload-artifact@v4
        with:
          name: musbread-cp35-public-build-files
          path: /tmp/musbread-build-web-files.json
          retention-days: 7
      - name: Reject private files and secrets in static export
        run: python3 ../../scripts/audit_public_artifacts.py out
      - name: Verify all internal routes and anchors
        run: python3 ../../scripts/audit_static_navigation.py out
      - name: Check public export
        run: |
          test -f out/index.html
          test -f out/events/index.html
          test -f out/events/bread-history/index.html
          test -f out/museum/museum-about/index.html
          test -f out/news/demo-news/index.html
          test -f out/excursions/demo-tour/index.html
          if grep -R -E '(DATABASE_URL|APP_KEY|MOONSHINE_SECRET)' out/; then
            echo "Potential secret in site export"
            exit 1
          fi
  cms:
    name: Laravel tests (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd, zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native SVG rasterizer and read-only XLS dependency
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          python3 -m pip install "xlrd==2.0.2"
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Check PHP dependency advisories
        run: composer audit --locked --no-interaction
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: mkdir -p database && touch database/database.sqlite && php artisan migrate --force
      - run: php artisan test
      - name: Publish native MoonShine assets for installed-binary license/integrity inspection
        run: php artisan vendor:publish --tag=laravel-assets --force
      - name: Verify installed Composer runtime and private CMS assets
        run: python3 ../../scripts/audit_built_artifacts.py --mode cms --out /tmp/musbread-build-cms-files.json
      - name: Preserve actual private CMS vendor asset and PHP tree hashes
        uses: actions/upload-artifact@v4
        with:
          name: musbread-cp35-cms-installed-files
          path: /tmp/musbread-build-cms-files.json
          retention-days: 7
      - name: Check Laravel to Next.js publication parity
        run: |
          php artisan db:seed --class=DemoMuseumContentSeeder --force
          php artisan museum:export
          python3 ../../scripts/publish_snapshot.py --check
  cms-production:
    name: Verify production-only PHP dependencies and CMS static assets
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd, zip
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install EXACT locked production packages (not development)
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
      - name: Exercise production Laravel bootstrap and publish native admin assets
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list --path=admin >/tmp/musbread-admin-routes.txt
          grep -q 'admin' /tmp/musbread-admin-routes.txt
          php artisan vendor:publish --tag=laravel-assets --force
      - name: Verify installed runtime matches production lock WITHOUT dev packages
        run: |
          python3 ../../scripts/audit_built_artifacts.py --mode cms --composer-profile production --out /tmp/musbread-production-cms-evidence.json
          python3 - <<'PYVERIFY'
          import json
          p=json.load(open('/tmp/musbread-production-cms-evidence.json'))['result']
          assert p['production_profile_verified'] is True, 'production package profile mismatch'
          assert p['development_packages_installed']==0, 'dev package leaked into production'
          assert p['installed_package_count']==p['production_locked_package_count']
          assert p['tiny_mce_removal_status']=='STILL_INSTALLED', 'license disclaimer must remain explicit'
          print('Production Composer packages:',p['installed_package_count'])
          print('Dev Composer packages:',p['development_packages_installed'])
          print('Private CMS public assets:',p['public_vendor_count'])
          PYVERIFY
      - name: Preserve actual Linux production-only inventory (not museum acceptance)
        uses: actions/upload-artifact@v4
        with:
          name: musbread-cp36-linux-production-cms-files
          path: /tmp/musbread-production-cms-evidence.json
          retention-days: 7

  integration:
    name: CMS editor → build → verified public release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3, gd, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and frontend
        run: |
          cd apps/cms
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
          # composer install does not run post-update-cmd: MoonShine/TinyMCE
          # assets otherwise return 404 and Alpine x-cloak hides the login.
          php artisan vendor:publish --tag=laravel-assets --force
          touch database/database.sqlite
          php artisan migrate --force
          php artisan db:seed --class=DemoMuseumContentSeeder --force
          cd ../web
          npm ci
      - name: Execute native cross-stack publication
        run: sh scripts/demo_publish.sh
      - name: Verify static site and release
        run: |
          python3 scripts/release_site.py verify
          test -f deploy/local/current/index.html
          test -f deploy/local/current/museum/museum-about/index.html
          test -f deploy/local/current/news/demo-news/index.html
          test -f deploy/local/current/excursions/demo-tour/index.html
          cd apps/cms
          php artisan schedule:list | grep 'museum:export'
      - name: Install Chromium for isolated private CMS browser QA
        run: |
          cd apps/web
          npx playwright install --with-deps chromium
      - name: Browser E2E with temporary SQLite and ephemeral QA account
        run: python3 scripts/qa_cms_browser.py

  infra:
    name: Infrastructure templates and Nginx parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check templates do not expose private CMS
        run: python3 -m unittest tests/test_infra_templates.py -v
      - name: Parse both Linux Nginx examples
        run: |
          mkdir -p /tmp/musbread-csp-fixture
          printf '<html><script>window.__test = true;</script></html>' > /tmp/musbread-csp-fixture/index.html
          python3 scripts/build_csp.py /tmp/musbread-csp-fixture --output /tmp/musbread-csp.conf
          sudo cp /tmp/musbread-csp.conf /etc/nginx/musbread-csp.conf
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx
          sudo cp infra/nginx/http-rates.conf /etc/nginx/conf.d/musbread-rates.conf
          sudo cp infra/nginx/public-static.conf /etc/nginx/sites-enabled/musbread-public.conf
          sudo cp infra/nginx/private-cms.conf /etc/nginx/sites-enabled/musbread-private.conf
          sudo nginx -t
          sudo mkdir -p /srv/musbread/public/current
          sudo cp /tmp/musbread-csp-fixture/index.html /srv/musbread/public/current/index.html
          sudo nginx
          curl -fsSI http://127.0.0.1:18080/ | grep -qi 'content-security-policy:'
          curl -fsSI http://127.0.0.1:18080/ | grep -qi 'x-content-type-options: nosniff'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/admin/login)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/test.php)" = 404
          # Even private MoonShine depends on static /vendor CSS/JS/font paths.
          # Only allow the two known namespaces and static extensions.
          sudo mkdir -p /srv/musbread/cms/public/vendor/moonshine/assets
          sudo mkdir -p /srv/musbread/cms/public/vendor/moonshine-tinymce
          sudo mkdir -p /srv/musbread/cms/public/vendor/evil
          printf 'window.__moonshine=true;' | sudo tee /srv/musbread/cms/public/vendor/moonshine/assets/app.js >/dev/null
          printf 'window.__tiny=true;' | sudo tee /srv/musbread/cms/public/vendor/moonshine-tinymce/tinymce.min.js >/dev/null
          printf 'never serve this' | sudo tee /srv/musbread/cms/public/vendor/moonshine-tinymce/license.md >/dev/null
          printf 'never serve this' | sudo tee /srv/musbread/cms/public/vendor/evil/executable.js >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/vendor/moonshine/assets/app.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/vendor/moonshine-tinymce/tinymce.min.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/vendor/moonshine-tinymce/license.md)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/vendor/evil/executable.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/vendor/moonshine/.env)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18082/vendor/moonshine/unsafe.php)" = 404

name: MusBread quality gates
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  publisher:
    name: Static publication integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/publish_snapshot.py --check
  web:
    name: Next.js lint, types and static export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: python3 ../../scripts/release_site.py deploy && python3 ../../scripts/release_site.py verify
      - name: Check public export
        run: |
          test -f out/index.html
          test -f out/events/index.html
          test -f out/events/bread-history/index.html
          if grep -R -E '(DATABASE_URL|APP_KEY|MOONSHINE_SECRET)' out/; then
            echo "Potential secret in site export"
            exit 1
          fi
  cms:
    name: Laravel tests (PHP 8.4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cms
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, pdo_sqlite, sqlite3
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: mkdir -p database && touch database/database.sqlite && php artisan migrate --force
      - run: php artisan test
      - name: Check Laravel to Next.js publication parity
        run: |
          php artisan db:seed --class=DemoMuseumContentSeeder --force
          php artisan museum:export
          python3 ../../scripts/publish_snapshot.py --check
